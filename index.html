  <style>
    /* =========================================================
       1. CSS VARIABLES & THEME CONFIGURATION
       Zimbabwe-inspired colors + modern card aesthetic
       ========================================================= */
    :root {
      /* Dark theme (default) */
      --bg: #0a0a0a;
      --bg-card: #111111;
      --fg: #ededed;
      --muted: #888888;
      --accent: #00a651; /* Zimbabwe green */
      --accent-secondary: #fcd116; /* Zimbabwe yellow */
      --border: #222222;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 8px 30px rgba(0, 166, 81, 0.25);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --max-width: 720px;
      --spacing: 2rem;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.25s ease;
    }

    /* Light theme override */
    [data-theme="light"] {
      --bg: #fafafa;
      --bg-card: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --accent: #007a3d;
      --accent-secondary: #d4af37;
      --border: #e5e5e5;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 8px 30px rgba(0, 122, 61, 0.2);
    }

    /* Respect system preference if no manual override */
    @media (prefers-color-scheme: light) {
      html:not([data-theme]) {
        --bg: #fafafa; --bg-card: #ffffff; --fg: #111111; --muted: #666666;
        --accent: #007a3d; --accent-secondary: #d4af37;
        --border: #e5e5e5;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 8px 30px rgba(0, 122, 61, 0.2);
      }
    }

    /* =========================================================
       2. RESET & BASE STYLES
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 1rem;
      line-height: 1.6;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--spacing);
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
    }

    /* Accessibility: Skip link */
    .skip-link {
      position: absolute; top: -40px; left: 0;
      background: var(--accent); color: #fff;
      padding: 0.5rem 1rem; z-index: 100;
      transition: top 0.2s; border-radius: var(--radius-sm);
    }
    .skip-link:focus { top: 0; outline: 2px solid var(--accent); outline-offset: 2px; }

    /* =========================================================
       3. HEADER (NOT IN CARD) - Name + Avatar + Country
       ========================================================= */
    header.hero {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      margin-bottom: 1rem;
    }
    
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      margin: 0 auto 1rem;
      display: grid; place-items: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: #000;
      box-shadow: var(--shadow);
      border: 3px solid var(--bg-card);
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .avatar:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-hover);
    }
    
    header.hero h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 800; letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }
    
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    
    .location-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--bg-card);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* Subtle Zimbabwe flag accent bar */
    .flag-bar {
      height: 3px;
      background: linear-gradient(90deg, 
        #007a3d 25%, #fcd116 25%, #fcd116 50%, 
        #000 50%, #000 75%, #e11c26 75%);
      margin: 0 auto 2rem;
      border-radius: 2px;
      opacity: 0.8;
      max-width: 200px;
    }

    /* =========================================================
       4. CARD SYSTEM - Reusable Component Styles
       ========================================================= */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-hover);
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 1.1rem; font-weight: 600; color: var(--fg);
      text-transform: lowercase; letter-spacing: 0.02em;
    }
    .card-icon {
      font-size: 1.2rem; opacity: 0.8;
    }

    /* =========================================================
       5. CONTENT COMPONENTS (Lists, Links, Badges, etc.)
       ========================================================= */
    ul { list-style: none; }
    li { margin: 0.4rem 0; }

    a {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color var(--transition), color var(--transition);
    }
    a:hover { border-bottom-color: var(--accent); }
    .ext-icon { font-size: 0.85em; opacity: 0.6; margin-left: 3px; }

    /* Contact buttons */
    .contact-grid { display: grid; gap: 0.6rem; }
    .contact-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.6rem 0.85rem;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      font-weight: 500; font-size: 0.9rem;
      transition: all var(--transition);
    }
    .contact-btn:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    .contact-btn .label { display: flex; align-items: center; gap: 0.5rem; }
    .contact-btn .hint {
      font-size: 0.75rem; color: var(--muted);
      opacity: 0; transition: opacity 0.2s;
    }
    .contact-btn:hover .hint { opacity: 1; }
    .contact-btn.discord:hover { border-color: #5865F2; }
    .contact-btn.email:hover { border-color: #ea4335; }
    .contact-btn.github:hover { border-color: var(--accent); }

    /* Project cards */
    .projects-grid { display: grid; gap: 1rem; }
    .project-card {
      border-left: 3px solid var(--border);
      padding-left: 1rem;
      transition: border-color var(--transition);
    }
    .project-card:hover { border-left-color: var(--accent); }
    
    .project-title { font-weight: 600; display: inline-block; margin-bottom: 0.25rem; }
    .project-desc { color: var(--muted); font-size: 0.95rem; margin: 0.25rem 0 0.5rem; }
    
    .project-status {
      font-size: 0.8rem; color: var(--accent-secondary);
      margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.3rem;
    }
    .status-dot { 
      display: inline-block; width: 6px; height: 6px; 
      background: var(--accent-secondary); border-radius: 50%; 
    }

    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .badge {
      background: var(--border); color: var(--fg);
      padding: 0.2rem 0.6rem; border-radius: var(--radius-sm);
      font-size: 0.75rem; font-weight: 500;
      border: 1px solid transparent; transition: border-color var(--transition);
    }
    .badge:hover { border-color: var(--accent); }
    .badge.discord { background: #5865F2; color: #fff; border-color: #5865F2; }

    /* Status section */
    #status-container { min-height: 2.4em; }
    .status-loading { color: var(--muted); font-style: italic; }
    .status-dot-large { 
      display: inline-block; width: 8px; height: 8px; 
      background: var(--accent); border-radius: 50%; margin-right: 6px; 
    }

    /* =========================================================
       6. FOOTER & THEME TOGGLE
       ========================================================= */
    footer {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
      color: var(--muted); font-size: 0.85rem;
      padding-top: 1.5rem; margin-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .theme-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--fg); width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
      display: grid; place-items: center;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }
    .theme-btn:hover { 
      background: var(--accent); border-color: var(--accent); color: #000;
      transform: rotate(15deg);
    }
    .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* =========================================================
       7. RESPONSIVE & ACCESSIBILITY
       ========================================================= */
    @media (max-width: 520px) {
      body { padding: 1.25rem; }
      header.hero { padding: 1.5rem 0.5rem 1rem; }
      .avatar { width: 80px; height: 80px; font-size: 2rem; }
      footer { flex-direction: column; align-items: flex-start; }
      .contact-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Easter egg animation */
    @keyframes hue-rotate { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    .rainbow-mode { animation: hue-rotate 3s linear infinite; }
  </style>
</head>
